<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Dijital İkiz Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<style>
body{
    margin:0;
    padding:20px;
    background:#0f172a;
    color:white;
    font-family:Arial;
}

h1{
    text-align:center;
}

.cards{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-top:30px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    text-align:center;
}

.value{
    font-size:28px;
    font-weight:bold;
    margin-top:10px;
}

.alarm-on{
    color:#ef4444;
}

.alarm-off{
    color:#22c55e;
}

.chart-box{
    margin-top:30px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#94a3b8;
}
</style>
</head>

<body>

<h1>🏫 Dijital İkiz Dashboard</h1>

<div class="cards">

<div class="card">
<h3>🌡️ Sıcaklık</h3>
<div class="value" id="temp">0 °C</div>
</div>

<div class="card">
<h3>💧 Nem</h3>
<div class="value" id="hum">0 %</div>
</div>

<div class="card">
<h3>🔥 Gaz</h3>
<div class="value" id="gas">0</div>
</div>

<div class="card">
<h3>⚡ Akım</h3>
<div class="value" id="current">0 A</div>
</div>

<div class="card">
<h3>🚨 Alarm</h3>
<div class="value" id="alarm">Normal</div>
</div>

</div>

<div class="chart-box">
<h3>Canlı Grafik</h3>
<canvas id="chart"></canvas>
</div>

<div class="footer">
Son Güncelleme: <span id="time">-</span>
</div>

<script>
let chart;

function initChart(){
  chart = new Chart(document.getElementById("chart"),{
    type:'line',
    data:{
      labels:[],
      datasets:[
        { label:'Sıcaklık', data:[], borderColor:'#ef4444', tension:0.3 },
        { label:'Nem', data:[], borderColor:'#3b82f6', tension:0.3 },
        { label:'Akım', data:[], borderColor:'#22c55e', tension:0.3 }
      ]
    },
    options:{
      responsive:true,
      plugins:{ legend:{ labels:{ color:'white' } } },
      scales:{
        x:{ ticks:{ color:'white' } },
        y:{ ticks:{ color:'white' } }
      }
    }
  });
}

async function loadLive(){
  let res = await fetch('/api/live?t=' + Date.now());
  let data = await res.json();

  if(!data || !data.id) return;

  document.getElementById("temp").innerText = data.temperature + " °C";
  document.getElementById("hum").innerText = data.humidity + " %";
  document.getElementById("gas").innerText = data.gas;
  document.getElementById("current").innerText = Number(data.current || 0).toFixed(2) + " A";

  let alarm = document.getElementById("alarm");

  if(data.gas_alarm == true){
    alarm.innerText = "TEHLİKE";
    alarm.className = "value alarm-on";
  }else{
    alarm.innerText = "Normal";
    alarm.className = "value alarm-off";
  }

  document.getElementById("time").innerText =
    new Date(data.created_at).toLocaleString("tr-TR");
}

async function loadChart(){
  let res = await fetch('/api/history?t=' + Date.now());
  let rows = await res.json();

  if(!rows || rows.length === 0) return;

  chart.data.labels = rows.map(x =>
    new Date(x.created_at).toLocaleTimeString("tr-TR")
  );

  chart.data.datasets[0].data = rows.map(x => Number(x.temperature || 0));
  chart.data.datasets[1].data = rows.map(x => Number(x.humidity || 0));
  chart.data.datasets[2].data = rows.map(x => Number(x.current || 0));

  chart.update();
}

async function refresh(){
  await loadLive();
  await loadChart();
}

initChart();
refresh();
setInterval(refresh,3000);
</script>

</body>
</html>
